<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STICKFIGHT</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">
  <canvas id="stage" width="960" height="540"></canvas>

  <section id="menu" class="panel menu" hidden>
    <h1>STICKFIGHT</h1>
    <p class="tag">PRE-RELEASE BUILD</p>
    <nav class="menu-nav">
      <button data-go="play">PLAY</button>
      <button data-go="characters">CHARACTERS</button>
      <button data-go="training">TRAINING ROOM</button>
      <button data-go="settings">SETTINGS</button>
    </nav>
    <p id="notice" class="notice" role="status"></p>
    <p class="status">SERVER: NOT CONNECTED</p>
  </section>

  <section id="characters" class="panel side" hidden>
    <h2 id="char-name"></h2>
    <p id="char-desc"></p>
    <ul id="char-abilities" class="list"></ul>
    <div class="row">
      <button id="confirm-character">CONFIRM</button>
      <button data-back>BACK</button>
    </div>
  </section>

  <section id="settings" class="panel side" hidden>
    <h2>SETTINGS</h2>
    <label class="check"><input type="checkbox" id="show-fps"> SHOW FPS</label>
    <div class="row"><button data-back>BACK</button></div>
  </section>

  <section id="training" class="panel hud" hidden>
    <div class="stats"><span id="hp"></span><span id="combo"></span></div>
    <div class="row">
      <button id="reset-dummy">RESET DUMMY</button>
      <button id="reset-position">RESET POSITION</button>
      <label class="check"><input type="checkbox" id="show-hitboxes"> SHOW HITBOXES</label>
      <button data-back>MENU</button>
    </div>
    <p class="help">A/D move · Shift run · W jump · F block · 1 slam · 2 burst · 3 barrage · 4 phantom · Left click M1 · Esc menu</p>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
